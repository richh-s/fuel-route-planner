[project]
name = "fuel-route-planner"
version = "1.0.0"
description = "Django REST API that plans US driving routes with the cheapest fuel stops."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # modern Python syntax
    "SIM", # simplifications
    "DJ",  # Django conventions
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["apps", "config", "scripts", "gunicorn.conf.py"]
exclude = ["/migrations/", "/tests/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = ["drf_spectacular.*", "corsheaders.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
