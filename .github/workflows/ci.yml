name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECURE_SSL_REDIRECT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate a throwaway secret key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Django checks
        run: |
          DJANGO_SECURE_SSL_REDIRECT=true python manage.py check --deploy --fail-level WARNING
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --fail-on-warn --file /dev/null

      - name: Tests
        run: python manage.py test

