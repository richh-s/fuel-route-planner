name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECURE_SSL_REDIRECT: "false"
      LOG_LEVEL: WARNING
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Generate a throwaway secret key
        run: echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Django checks
        # Deploy checks run against a production-shaped configuration: they must pass with no warnings.
        env:
          DJANGO_SECURE_SSL_REDIRECT: "true"
          OSRM_BASE_URL: http://osrm:5000
          REDIS_URL: redis://redis:6379/0
          NUM_PROXIES: "1"
          API_KEYS: ci-placeholder-key
        run: |
          python manage.py check --deploy --fail-level WARNING
          python manage.py makemigrations --check --dry-run
          python manage.py spectacular --validate --fail-on-warn --file /dev/null

      - name: Tests with coverage
        run: |
          coverage run manage.py test
          coverage report

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --require-hashes --disable-pip -r requirements.txt

  image:
    runs-on: ubuntu-latest
    needs: [test, audit]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fuel-route-planner:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke-test-secret-key-not-used-anywhere-else \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e DJANGO_SECURE_SSL_REDIRECT=false \
            fuel-route-planner:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/health/ready/ -o ready.json; then break; fi
            sleep 1
          done
          cat ready.json
          python -c "import json; body = json.load(open('ready.json')); assert body['status'] == 'ok' and body['stations_loaded'] > 6000, body"
          curl -fsS -o /dev/null http://localhost:8000/static/routing/vendor/leaflet/leaflet.js
          docker inspect --format '{{.Config.User}}' app | grep -qx app

      - name: Container logs
        if: always()
        run: docker logs app || true

      # Version tags (v1.2.3) publish the image; deploy by pointing your platform at the new tag.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag fuel-route-planner:ci "$image:${GITHUB_REF_NAME}"
          docker tag fuel-route-planner:ci "$image:latest"
          docker push "$image:${GITHUB_REF_NAME}"
          docker push "$image:latest"
